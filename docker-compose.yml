version: '3.4'

services:
    
  dental.db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dental_sql_server
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=DentalApp#2026!  
    ports:
        - "1433:1433"

  dentalmanagementsystem.api:
    image: ${DOCKER_REGISTRY-}dentalmanagementsystemapi
    container_name: dental_api_service
    build:
      context: .
      dockerfile: DentalManagementSystem.API/Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      - dental.db
    environment:
      - ConnectionStrings__DentalManagementApplicationConnection=Server=dental.db;Database=DentalManagementSystem_Application_db;User Id=sa;Password=DentalApp#2026!;TrustServerCertificate=True;
      - ConnectionStrings__DentalManagementIdentityConnection=Server=dental.db;Database=DentalManagementSystem_Identity_db;User Id=sa;Password=DentalApp#2026!;TrustServerCertificate=True;


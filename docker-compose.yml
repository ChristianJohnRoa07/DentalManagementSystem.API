version: '3.4'

services:
    
  dentalmanagementsystem.db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dental_sql_server
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=DentalApp#2026!  
    ports:
        - "1433:1433"
    volumes:
        - dentalmanagementsystem_data:/var/opt/mssql 
    networks:
      - dental-network
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "DentalApp#2026!", "-Q", "SELECT 1", "-C"]
      interval: 10s
      timeout: 5s
      retries: 5

  dentalmanagementsystem.api:
    image: ${DOCKER_REGISTRY-}dentalmanagementsystemapi
    container_name: dental_api_service
    build:
      context: .
      dockerfile: DentalManagementSystem.API/Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DentalManagementApplicationConnection=Server=dentalmanagementsystem.db;Database=DentalManagementSystem_Application_db;User Id=sa;Password=DentalApp#2026!;TrustServerCertificate=True;
      - ConnectionStrings__DentalManagementIdentityConnection=Server=dentalmanagementsystem.db;Database=DentalManagementSystem_Identity_db;User Id=sa;Password=DentalApp#2026!;TrustServerCertificate=True;
    networks:
      - dental-network 
    depends_on:
      dentalmanagementsystem.db:
        condition: service_healthy

volumes:
  dentalmanagementsystem_data:
    driver: local

networks:
  dental-network:
    driver: bridge

